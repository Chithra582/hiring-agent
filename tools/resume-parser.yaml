name: "resume-parser"
description: "Extracts contact info, education, work experience, projects, and skills from candidate PDF files."
input_schema:
  type: object
  properties:
    pdf_path:
      type: string
      description: "Path to candidate resume PDF file."
    extract_skills_only:
      type: boolean
      description: "Whether to restrict extraction exclusively to technical skills."
      default: false
  required:
    - pdf_path
